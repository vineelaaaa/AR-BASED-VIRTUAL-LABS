{% extends "base.html" %}
{% block title %}Register — AR Virtual Physics Lab{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="panel auth-panel">
    <div class="eyebrow-line"><span class="rule"></span> NEW STUDENT ENROLLMENT</div>
    <h2>Create your account</h2>
    <p class="auth-sub">Register once to unlock all three virtual experiments.</p>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="field">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" placeholder="e.g. Neha Patil" value="{{ form.full_name or '' }}" required autofocus>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="neha_patil" value="{{ form.username or '' }}" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="neha@college.edu" value="{{ form.email or '' }}" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-solid btn-block">Create Account</button>
    </form>

    <div class="auth-foot">
      Already registered? <a href="{{ url_for('login') }}">Log in instead</a>
    </div>
  </div>
</div>
{% endblock %}
